<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalenderverwaltung | Platino Ladies</title><link rel="stylesheet" href="style.css"><style>main{max-width:950px;margin:50px auto;padding:20px}.pl-form{display:grid;gap:12px;max-width:650px}.pl-form input,.pl-form select,.pl-form textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;background:#21182e;color:white;border:1px solid #72538b}.pl-form label{display:block}.pl-row{display:flex;gap:10px;flex-wrap:wrap}.pl-event{padding:16px;margin:12px 0;border:1px solid #70578a;border-radius:12px}.pl-event button{margin-right:8px}button{cursor:pointer}</style></head><body><main><a href="leitungszentrale.html">← Leitungszentrale</a><div class="hero"><div class="eyebrow">✦ NUR FÜR DIE CLUBFÜHRUNG ✦</div><h1>Kalenderverwaltung</h1><p class="lead">Termine für alle Clubmitglieder planen.</p></div><section class="card"><p id="admin-status" role="status"></p><form id="event-form" class="pl-form"><h2 id="form-title">✧ Neuen Termin erstellen</h2><input id="event-id" type="hidden"><label>Titel<input id="title" maxlength="120" required></label><label>Kategorie<select id="category"><option>Dressur</option><option>Freizeit</option><option>Competition</option><option>Event</option></select></label><label>Beginn<input id="starts_at" type="datetime-local" required></label><label>Ende<input id="ends_at" type="datetime-local" required></label><label>Treffpunkt<input id="location" maxlength="250"></label><label>Beschreibung<textarea id="description" rows="4" maxlength="2000"></textarea></label><div class="pl-row"><button class="btn" type="submit">✦ Termin speichern</button><button class="btn ghost" id="cancel" type="button">Zurücksetzen</button></div></form></section><section class="card"><h2>✧ Eingetragene Termine</h2><div id="events"></div></section></main><footer>✧ Platino Ladies</footer><script src="leitungs-kalender.js" defer></script></body></html>
